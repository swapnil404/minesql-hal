services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: minesql-mc
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21"
      MEMORY: 2G
      MINESQL_HOST: host.docker.internal
      LEVEL_TYPE: "flat"
      GENERATOR_SETTINGS: '{"layers":[{"block":"minecraft:air","height":127},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}'
      GENERATE_STRUCTURES: "false"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      SPAWN_MONSTERS: "false"
      SPAWN_ANIMALS: "false"
      ENABLE_RCON: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "25565:25565"
      - "25576:25576"
    volumes:
      - mc_data:/data
      - ./target/minesql-hal-0.1.0.jar:/plugins/minesql-hal-0.1.0.jar
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mc_data:
